
services:
  pki:
    # Use latest for testing, but consider pinning to a specific version for production deployments (e.g., ghcr.io/entr0-pi/pki-certificates:v2.0.0) 
    image: ghcr.io/entr0-pi/pki-certificates:latest
    container_name: pki
    ports:
    # Change to other port if 8000 is already in use on the host machine, eg. "8080:8000"
      - "8000:8000"
    environment:
      # ===== Docker-specific values =====

      # Server binding for container networking (port should be exposed in ports: section above)
      PKI_HOST: 0.0.0.0
      PKI_PORT: 8000

      # Storage paths managed by Docker volumes (see volumes: section below)
      # Not recommended to change
      PKI_DATA_DIR: /app/data
      PKI_DB_PATH: /app/database/pki.db

      # Logging level
      PKI_LOG_LEVEL: INFO

      # Cookie security for local development (set to true in production with HTTPS reverse proxy)
      PKI_COOKIE_SECURE: "false"

      # Base URL for issued certificates
      # Local development: http://localhost:8000
      # Production example: https://pki.yourdomain.com
      PKI_BASE_URL: http://localhost:8000

    # Load secrets and other configuration from .env (copy from ../.env.example)
    # Use the tool utils/generate_env.py to generate a .env file with secure random values for the encryption key and other secrets
    env_file:
      - .env

    volumes:
      # Persistent storage for encrypted certificate artifacts via Docker volume (optional, comment out if using bind mount)
      - pki_data:/app/data
      # ... OR via bind mount
      # Usefull when you want to easily rotate the encryption key using utils/encryption_manager.py
      # Uncomment to use, chmod -R 777 ./data to allow container access)
      #- ./data:/app/data
      
      # Persistent storage for SQLite database file via Docker volume (Bind mount not recommended for SQLite due to potential file locking issues)
      - pki_database:/app/database
      # ... OR via bind mount
      # Uncomment to use, chmod -R 777 ./database to allow container access)
      #- ./database:/app/database

    # No need to change the following settings for typical usage, but adjust as needed for your environment
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://pki:8000/healthz').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    restart: unless-stopped


volumes:
# Comment out the following volume definitions depending on whether you want to use Docker volumes or bind mounts for persistent storage (see volumes: section in the pki service above)
  pki_data:
    driver: local
  pki_database:
    driver: local