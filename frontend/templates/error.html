<!DOCTYPE html>
<html lang="en" data-theme="cupcake">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title | default("Error") }}</title>
    <link href="/static/vendor/bundle.css" rel="stylesheet" type="text/css" />
</head>
<body class="bg-base-200 min-h-screen p-6">
    <div class="container mx-auto max-w-3xl">
        <!-- Header -->
        <div class="card bg-base-100 shadow-xl mb-6">
            <div class="card-body">
                <span class="uppercase tracking-[0.4em] text-xs text-base-content/60">The ultimate tool</span>
                <h1 class="text-4xl sm:text-5xl font-semibold">{{ error_title | default("Error") }}</h1>
                <p class="text-lg text-base-content/70">{{ error_subtitle | default("An error occurred. Please try again.") }}</p>
            </div>
        </div>

        <!-- Error Card -->
        <div class="card bg-base-100 shadow-2xl">
            <div class="card-body p-8">
                <h2 class="text-2xl font-semibold mb-4">Error Details</h2>

                <div role="alert" class="alert alert-error mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div>
                        <h3 class="font-bold">Error Message:</h3>
                        <div class="text-sm mt-1">{{ error_message }}</div>
                    </div>
                </div>

                <div class="divider my-8"></div>

                <div class="card-actions justify-center">
                    <a href="/" class="btn btn-primary btn-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Try Again
                    </a>
                </div>
            </div>
        </div>

        <div class="text-center mt-6 text-base-content/60">
            <p class="text-sm">PKI Management System - Public Key Infrastructure</p>
        </div>
    </div>
    <script src="/static/theme-toggle.js"></script>
</body>
</html>
